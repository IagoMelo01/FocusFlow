services:
  mysql:
    image: mysql:8.4
    container_name: focusflow-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: focusflow
      MYSQL_USER: focusflow
      MYSQL_PASSWORD: focusflow
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - focusflow_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  focusflow_mysql:
